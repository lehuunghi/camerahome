services:
  camerahome:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      FRIGATE_URL: http://frigate:5000
    volumes:
      - /opt/frigate/storage/recordings:/recordings:ro
      - /opt/frigate/backup-status:/backup-status:ro
    networks:
      - camera_backend

networks:
  camera_backend:
    external: true
    name: camera_backend
